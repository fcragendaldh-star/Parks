<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | MCL Park Adoption Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--paper, #FAF8F3);
      color: var(--forest-900, #103322);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }
    .error-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      padding: 3rem 2rem;
      border-radius: 12px;
      border: 1px solid var(--forest-100, #E4F0E8);
      box-shadow: 0 10px 25px -5px rgba(11, 36, 24, 0.08);
    }
    .error-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: var(--forest-100, #E4F0E8);
      color: var(--forest-800, #15452C);
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 20px;
      margin-bottom: 1.25rem;
      letter-spacing: 0.05em;
    }
    .error-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--forest-950, #0B2418);
      margin: 0 0 1rem 0;
      line-height: 1.2;
    }
    .error-desc {
      font-size: 1rem;
      color: #4A5568;
      margin: 0 0 2rem 0;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--forest-700, #1B5A39);
      color: #ffffff;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn-home:hover {
      background: var(--forest-900, #103322);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-card">
      <span class="error-badge">404 ERROR</span>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The requested resource or page could not be found or access has been restricted by Municipal Corporation Ludhiana.</p>
      <a href="/" class="btn-home">
        &larr; Back to Portal Homepage
      </a>
    </div>
  </div>
</body>
</html>
